<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EduSeñas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/inicio.css') }}"
    >
</head>

<body>

    <main class="inicio">

        <!-- Decoración de los bordes -->
        <div class="decoracion decoracion--superior-izquierda"></div>
        <div class="decoracion decoracion--inferior-izquierda"></div>
        <div class="decoracion decoracion--superior-derecha"></div>
        <div class="decoracion decoracion--inferior-derecha"></div>

        <!-- Marca chica (logo original) -->
        <div class="inicio__marca">
            <img
                src="{{ url_for('static', filename='img/logo/logo.png') }}"
                alt="EduSeñas"
            >
        </div>

        <!-- Chispas y puntos decorativos -->
        <span class="chispa chispa--1" aria-hidden="true"></span>
        <span class="chispa chispa--2" aria-hidden="true"></span>
        <span class="chispa chispa--3" aria-hidden="true"></span>
        <span class="chispa chispa--4" aria-hidden="true"></span>

        <span class="punto punto--1" aria-hidden="true"></span>
        <span class="punto punto--2" aria-hidden="true"></span>
        <span class="punto punto--3" aria-hidden="true"></span>
        <span class="punto punto--4" aria-hidden="true"></span>
        <span class="punto punto--5" aria-hidden="true"></span>

        <span class="puntitos-arco" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
        </span>

        <!-- Contenido principal -->
        <section class="inicio__contenido">

            <!-- Logo -->
            <div class="inicio__logo">

                <h1 class="inicio__logo-texto" aria-label="EDUSEÑAS">
                    <span class="logo-letra logo-letra--1">E</span>
                    <span class="logo-letra logo-letra--2">D</span>
                    <span class="logo-letra logo-letra--3">U</span>
                    <span class="logo-letra logo-letra--4">S</span>
                    <span class="logo-letra logo-letra--5">E</span>
                    <span class="logo-letra logo-letra--6">Ñ</span>
                    <span class="logo-letra logo-letra--7">A</span>
                    <span class="logo-letra logo-letra--8">S</span>
                </h1>

                <div class="inicio__logo-linea"></div>

            </div>

            <!-- Presentación -->
            <div class="inicio__presentacion">

                <h2>
                    Aprendé, jugá y descubrí
                </h2>

                <p>
                    el mundo de la alfabetización
                </p>

            </div>

            <span class="inicio__corazon" aria-hidden="true">♥</span>

            <!-- Botón de ingreso -->
            <a
                href="{{ url_for('menu_principal.mostrar_menu') }}"
                class="inicio__boton"
            >
                INGRESAR
                <span class="inicio__boton-flecha">→</span>
            </a>

            <!-- Características -->
            <section class="inicio__caracteristicas">

                <article class="caracteristica">
                    <div class="caracteristica__icono caracteristica__icono--teal">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M12 6.2C10.4 4.8 8 4.1 5.6 4.1c-.6 0-1.1.5-1.1 1.1V17c0 .6.5 1 1 1c2.4 0 4.8.6 6.5 2c1.7-1.4 4.1-2 6.5-2c.6 0 1-.4 1-1V5.2c0-.6-.5-1.1-1.1-1.1c-2.4 0-4.8.7-6.4 2.1Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                            <path d="M12 6.2V20" stroke="currentColor" stroke-width="1.5"/>
                        </svg>
                    </div>

                    <p>
                        Reconocer palabras<br>
                        a través de las<br>
                        imágenes y videos.
                    </p>
                </article>


                <article class="caracteristica">
                    <div class="caracteristica__icono caracteristica__icono--purple">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="3.5" y="11" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8"/>
                            <rect x="13.5" y="11" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8"/>
                            <rect x="8.5" y="3" width="7" height="7" rx="1.6" stroke="currentColor" stroke-width="1.8"/>
                        </svg>
                    </div>

                    <p>
                        Aprender a<br>
                        formar palabras.
                    </p>
                </article>


                <article class="caracteristica">
                    <div class="caracteristica__icono caracteristica__icono--pink">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <rect x="3" y="8" width="18" height="9" rx="4.5" stroke="currentColor" stroke-width="1.6"/>
                            <path d="M8 11v3M6.5 12.5h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                            <circle cx="15.5" cy="11.3" r="1" fill="currentColor"/>
                            <circle cx="17.7" cy="13.5" r="1" fill="currentColor"/>
                        </svg>
                    </div>

                    <p>
                        Juegos para<br>
                        aprender de forma<br>
                        divertida.
                    </p>
                </article>


                <article class="caracteristica">
                    <div class="caracteristica__icono caracteristica__icono--yellow">
                        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                            <path d="M4 20V13M9.5 20V9M15 20v-5M20 20V6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                            <path d="M4 9l5-4 4 3 6-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16 3h3v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>

                    <p>
                        Sistema de progreso<br>
                        para cada niño.
                    </p>
                </article>

            </section>

            <!-- Frase inferior -->
            <p class="inicio__frase-final">
                Un espacio para
                <strong class="texto-leer">leer</strong>
                y
                <strong class="texto-escribir">escribir.</strong>
                <span class="frase-corazon">♥</span>
            </p>

        </section>

    </main>

</body>

</html>

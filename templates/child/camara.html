
{% extends "base.html" %}

{% block title %}EduSeñas - Dibujar{% endblock %}

{% block styles %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/camara.css') }}"
>

{% endblock %}

{% block content %}

<section class="camera-page">

    <div class="deco deco-star-1">⭐</div>
    <div class="deco deco-star-2">✨</div>
    <div class="deco deco-sun">☀️</div>
    <div class="deco deco-rainbow">🌈</div>
    <div class="deco deco-star-3">💫</div>

    <header class="camera-header">

        <div class="game-title">
            ✋ EDUSEÑAS
        </div>

        <a
            href="{{ url_for('vision.reconocer') }}"
            class="exit-button"
        >
            SALIR
        </a>

    </header>

    <main class="game-area">

        <aside class="left-panel">

            <div class="target-card">

                <div class="target-label">
                    LETRA
                </div>

                <div
                    class="big-letter"
                    id="letraObjetivo"
                >
                    A
                </div>

            </div>

            <div class="progress-card">

                <div class="progress-item">

                    <div class="progress-icon">
                        ⭐
                    </div>

                    <div class="progress-info">

                        <span>
                            BUENOS
                        </span>

                        <strong id="buenos">
                            0 / 3
                        </strong>

                    </div>

                </div>

                <div class="progress-item">

                    <div class="progress-icon">
                        🎯
                    </div>

                    <div class="progress-info">

                        <span>
                            INTENTOS
                        </span>

                        <strong id="intentos">
                            0 / 10
                        </strong>

                    </div>

                </div>

                <div class="mini-stars">
                    ☆ ☆ ☆
                </div>

            </div>

        </aside>

        <section class="camera-container">

            <div class="camera-screen">

                <video
                    id="video"
                    autoplay
                    playsinline
                    muted
                ></video>

                <canvas
                    id="canvas"
                ></canvas>

                <div class="camera-glow"></div>

            </div>

            <div class="camera-footer">

                <div class="action-pill">
                    🖐️
                </div>

                <div class="action-pill">
                    ✊
                </div>

                <div
                    class="status"
                    id="status"
                >
                    ● LISTO
                </div>

            </div>

        </section>

    </main>

    <div
        class="result-message"
        id="resultado"
    ></div>

</section>

{% endblock %}

{% block scripts %}

<script type="module">

    import {
        FilesetResolver,
        HandLandmarker
    } from "/static/vision_bundle.mjs";

    window.FilesetResolver =
        FilesetResolver;

    window.HandLandmarker =
        HandLandmarker;

    console.log(
        "MediaPipe cargado correctamente"
    );

    const script =
        document.createElement(
            "script"
        );

    script.src =
        "{{ url_for('static', filename='javascript/camara.js') }}";

    document.body.appendChild(
        script
    );

</script>

{% endblock %}

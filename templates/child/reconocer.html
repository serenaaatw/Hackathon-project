{% extends "base.html" %}

{% block title %}EDUSEÑAS — RECONOCER{% endblock %}

{% block styles %}
<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/reconocer.css') }}"
>
{% endblock %}

{% block content %}

<main class="learning-stage">

    <!-- PROGRESO -->
    <div
        class="learning-progress"
        id="learningProgress"
        aria-label="PROGRESO DEL APRENDIZAJE">
    </div>


    <!-- CATEGORÍA -->
    <div class="learning-category">
        {{ categoria_nombre }}
    </div>


    <!-- TARJETA DE APRENDIZAJE -->
    <section class="learning-card">

        <!-- VIDEO DE LSA -->
        <div class="learning-video">

            <video
                id="lsaVideo"
                playsinline
                controls
                preload="metadata">
            </video>

            <div
                id="videoPlaceholder"
                class="video-placeholder"
                hidden>

                <span>VIDEO LSA</span>

            </div>

        </div>


        <!-- IMAGEN DEL CONCEPTO -->
        <div class="learning-image">

            <img
                id="wordImage"
                src=""
                alt="">

        </div>


        <!-- PALABRA -->
        <div class="learning-word">

            <span id="wordText"></span>

        </div>

    </section>


    <!-- BOTONES -->
    <div class="learning-navigation">

        <button
            id="btnPrev"
            class="learning-nav"
            type="button"
            aria-label="PALABRA ANTERIOR">

            &lt;

        </button>


        <button
            id="btnNext"
            class="learning-nav"
            type="button"
            aria-label="SIGUIENTE PALABRA">

            &gt;

        </button>

    </div>

</main>

{% endblock %}


{% block scripts %}

<script>

    const PALABRAS = {{ palabras | tojson }};

    const IMG_BASE =
        "{{ url_for('static', filename='img/' + categoria_slug) }}/";

    const VIDEO_BASE =
        "{{ url_for('static', filename='videos/lsa/' + categoria_slug) }}/";

    const URL_JUEGO =
        "{{ url_for('game.juego1', categoria_slug=categoria_slug) }}";

</script>

<script
    src="{{ url_for('static', filename='javascript/reconocer.js') }}">
</script>

{% endblock %}

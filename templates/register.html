<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/inicio.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
    <title>Crear cuenta</title>
</head>
<body>

<div class="inicio">

    <!-- Fondo reutilizado de inicio.css -->
    <div class="decoracion decoracion--superior-izquierda"></div>
    <div class="decoracion decoracion--inferior-izquierda"></div>
    <div class="decoracion decoracion--superior-derecha"></div>
    <div class="decoracion decoracion--inferior-derecha"></div>

    <span class="chispa chispa--1"></span>
    <span class="chispa chispa--2"></span>
    <span class="chispa chispa--3"></span>
    <span class="chispa chispa--4"></span>

    <span class="punto punto--1"></span>
    <span class="punto punto--2"></span>
    <span class="punto punto--3"></span>
    <span class="punto punto--4"></span>
    <span class="punto punto--5"></span>

    <div class="puntitos-arco">
        <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="login__contenido login__contenido--ancho">

        <div class="login__logo">
            <img src="{{ url_for('static', filename='img/logo/logo.png') }}" alt="EduSeñas" class="login__logo-img">
        </div>

        <h1 class="login__titulo">Crear cuenta</h1>

        <p class="login__subtitulo">
            Herramienta de aprendizaje para niños sordos. Registrá a tu hijo/alumno y ayudalo a aprender de manera divertida y efectiva.
        </p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <div class="login__tarjeta">
            <form method="POST" action="{{ url_for('auth_routes.register_route') }}">

                <div class="login__fila">
                    <div class="login__campo">
                        <svg class="login__campo-icono" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <input type="text" name="name" placeholder="Nombre" required>
                    </div>

                    <div class="login__campo">
                        <svg class="login__campo-icono" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="8" r="4" stroke="currentColor" stroke-width="2"/>
                            <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <input type="text" name="last_name" placeholder="Apellido" required>
                    </div>
                </div>

                <div class="login__campo">
                    <svg class="login__campo-icono" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="2"/>
                        <path d="M9 10c0-1.2 1.1-2 3-2s3 .8 3 2-1.1 1.6-3 2-3 .8-3 2 1.1 2 3 2 3-.8 3-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="text" name="username" placeholder="Usuario" required>
                </div>

                <div class="login__campo">
                    <svg class="login__campo-icono" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="3" y="5" width="18" height="14" rx="2.5" stroke="currentColor" stroke-width="2"/>
                        <path d="M4 7l8 6 8-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <input type="email" name="email" placeholder="Email" required>
                </div>

                <div class="login__campo">
                    <svg class="login__campo-icono" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="5" y="11" width="14" height="9" rx="2" stroke="currentColor" stroke-width="2"/>
                        <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <input type="password" name="password" id="reg-password" placeholder="Contraseña" required>
                    <button type="button" class="login__ver-clave" id="btn-ver-clave" aria-label="Mostrar contraseña">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                            <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>

                <div class="login__rol-section">
                    <label class="login__rol-titulo">¿Quién usará esta cuenta?</label>
                    <div class="login__rol-options">

                        <label class="login__rol-card">
                            <input type="radio" name="rol" value="child" checked>
                            <div class="login__rol-content">
                                <span class="login__rol-icono login__rol-icono--emoji">👦</span>
                                <span class="login__rol-texto">Alumno / Niño</span>
                            </div>
                        </label>

                        <label class="login__rol-card">
                            <input type="radio" name="rol" value="tutor">
                            <div class="login__rol-content">
                                <span class="login__rol-icono login__rol-icono--emoji">👨‍🏫</span>
                                <span class="login__rol-texto">Tutor / Docente</span>
                            </div>
                        </label>

                    </div>
                </div>

                <button type="submit" class="login__boton">
                    Registrarse
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>

                <div class="login__extra login__extra--centro">
                    <span class="login__texto-simple">¿Ya tienes cuenta?</span>
                    <a href="{{ url_for('auth_routes.login_route') }}">Iniciar sesión</a>
                </div>

            </form>
        </div>

    </div>
</div>

<script>
    const btnVerClave = document.getElementById('btn-ver-clave');
    const inputClave = document.getElementById('reg-password');

    btnVerClave.addEventListener('click', () => {
        const esPassword = inputClave.type === 'password';
        inputClave.type = esPassword ? 'text' : 'password';
        btnVerClave.classList.toggle('login__ver-clave--activo', esPassword);
    });
</script>

</body>
</html>

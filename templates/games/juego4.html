{% extends "base.html" %}

{% block title %}
    Letra faltante - EDUseñas
{% endblock %}

{% block styles %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/juego4.css') }}"
>

{% endblock %}

{% block content %}

<section
    class="juego4"
    id="juego4"
    data-categoria="{{ categoria_slug }}"
    data-dificultad="{{ dificultad }}"
>

    <div class="juego4__encabezado">

        <span class="juego4__categoria">
            {{ categoria_nombre }}
        </span>

        <div
            class="juego4__progreso"
            id="progreso"
        ></div>

    </div>

    <div class="juego4__consigna">

        <p>
            COMPLETÁ LA PALABRA
        </p>

    </div>

    <div class="juego4__contenido">

        <div class="juego4__imagen-contenedor">

            <img
                id="imagenPalabra"
                class="juego4__imagen"
                src=""
                alt=""
            >

        </div>

        <div
            class="juego4__palabra"
            id="palabra"
        ></div>

        <div
            class="juego4__opciones"
            id="opciones"
        ></div>

        <div
            class="juego4__feedback"
            id="feedback"
        ></div>

    </div>

    <div
        class="juego4__tutorial"
        id="tutorial"
    >

        <div class="juego4__tutorial-contenido">

            <button
                type="button"
                class="juego4__tutorial-cerrar"
                id="cerrarTutorial"
                aria-label="Cerrar tutorial"
            >
                ×
            </button>

            <div class="juego4__tutorial-imagen">

                <img
                    src="{{ url_for('static', filename='img/animales/perro.png') }}"
                    alt="Perro"
                >

            </div>

            <div
                class="juego4__tutorial-palabra"
                id="tutorialPalabra"
            >

                <span>P</span>
                <span class="tutorial-faltante">_</span>
                <span>R</span>
                <span>R</span>
                <span>O</span>

            </div>

            <div
                class="juego4__tutorial-opciones"
                id="tutorialOpciones"
            >

                <button type="button">A</button>

                <button
                    type="button"
                    class="tutorial-letra-correcta"
                >
                    E
                </button>

                <button type="button">I</button>
                <button type="button">O</button>
                <button type="button">U</button>
                <button type="button">M</button>

            </div>

            <div class="juego4__tutorial-indicacion">

                <span id="tutorialIndicador">
                    👆
                </span>

                <span id="tutorialTexto">
                    ELEGÍ LA LETRA QUE FALTA
                </span>

            </div>

            <div class="juego4__tutorial-botones">

                <button
                    type="button"
                    class="juego4__tutorial-repetir"
                    id="repetirTutorial"
                    aria-label="Repetir tutorial"
                    title="Repetir"
                >
                    ↻
                </button>

                <button
                    type="button"
                    class="juego4__tutorial-avanzar"
                    id="avanzarTutorial"
                    aria-label="Continuar"
                    title="Continuar"
                >
                    →
                </button>

            </div>

        </div>

    </div>

</section>

{% endblock %}

{% block scripts %}

<script>

    const PALABRAS = {{ palabras | tojson }};

    window.PALABRAS = PALABRAS;

</script>

<script
    src="{{ url_for('static', filename='javascript/juego4.js') }}"
></script>

{% endblock %}

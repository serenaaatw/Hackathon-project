{% extends "base.html" %}

{% block title %}
EDUSEÑAS — JUEGO
{% endblock %}


{% block styles %}

<link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/juego1.css') }}"
>

{% endblock %}


{% block content %}

<div class="trail" id="trail"></div>


<main class="stage">

    <p class="stage__eyebrow">
        {{ categoria_nombre }}
    </p>


    <button
        class="mode-toggle"
        id="modeToggle"
        type="button"
        hidden
    >
        <span id="modeLabel">
            IMAGEN → PALABRA
        </span>
    </button>


    <section
        class="prompt-card"
        id="promptImageCard"
    >

        <div
            class="prompt-card__sticker"
            id="promptSticker"
        ></div>

    </section>


    <section
        class="prompt-card prompt-card--video"
        id="promptVideoCard"
        hidden
    >

        <div class="video-frame">

            <video
                id="lsaVideo"
                playsinline
                muted
                loop
                hidden
            ></video>


            <div
                class="video-frame__placeholder"
                id="videoPlaceholder"
            >

                <p>
                    VIDEO LSA
                </p>

            </div>

        </div>

    </section>


    <p
        class="stage__instruction"
        id="instruction"
    >
        TOCÁ LA PALABRA QUE CORRESPONDE
    </p>


    <div
        class="options"
        id="options"
    ></div>


    <p
        class="feedback"
        id="feedback"
    ></p>

</main>


<div class="tutorial" id="tutorial" hidden>

    <div class="tutorial__background"></div>

    <div class="tutorial__card">

        <button
            class="tutorial__close"
            id="tutorialClose"
            type="button"
            aria-label="Cerrar">
            ×
        </button>

        <div class="tutorial__progress">
            <span class="tutorial-dot tutorial-dot--active"></span>
            <span class="tutorial-dot"></span>
            <span class="tutorial-dot"></span>
        </div>

        <div class="tutorial__content" id="tutorialContent">

            <div class="tutorial__image">
                <img id="tutorialImage" src="" alt="">
            </div>

            <div class="tutorial__options" id="tutorialOptions"></div>

        </div>

        <div class="tutorial__actions">

            <button
                class="tutorial__repeat"
                id="tutorialRepeat"
                type="button"
                aria-label="Repetir tutorial">
                ↶
            </button>

            <button
                class="tutorial__next"
                id="tutorialNext"
                type="button"
                aria-label="Continuar">
                →
            </button>

        </div>

    </div>

</div>
{% endblock %}


{% block scripts %}

    <script>

        const PALABRAS =
            {{ palabras | tojson }};

        const IMG_BASE =
            "{{ url_for('static', filename='img/' + categoria_slug) }}/";

        const VIDEO_BASE =
            "{{ url_for('static', filename='videos/lsa/' + categoria_slug) }}/";

    </script>


    <script
        src="{{ url_for(
            'static',
            filename='javascript/games.js'
        ) }}"
    ></script>

{% endblock %}
